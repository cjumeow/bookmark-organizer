# Runs every check in `npm run check` on a pull request and on main, one step each so a failure names its check.
name: check-code

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run it makes obsolete. Runs on main are never cancelled, so every
# merged commit ends green or red.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:versions
      - run: npm run build
